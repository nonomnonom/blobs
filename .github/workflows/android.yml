name: Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  corpus:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
      - name: Install pinned preparation environment
        run: uv sync --locked
      - name: Check Python and native code quality
        run: |
          uv run --locked ruff check ../android/tools .
          uv run --locked ruff format --check ../android/tools .
          uv run --locked clang-format --dry-run --Werror ../android/app/src/main/cpp/blobs.cpp ../android/app/src/main/cpp/local_model_runtime.cpp ../android/app/src/main/cpp/local_model_runtime.h ../android/app/src/main/cpp/kv_cache.cpp ../android/app/src/main/cpp/kv_cache.h
      - name: Verify acquisition, normalization, recovery and native package contract
        run: |
          uv run --locked python -m unittest discover -s tests
          uv run --locked python -m unittest discover -s ../android/tools/tests

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
      - name: Install current Android tools and compile SDK
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install 'cmdline-tools;latest'
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Fetch pinned native source
        run: uv run --locked --project ../corpus python tools/fetch_runtime.py
      - name: Verify application
        run: |
          bash ./gradlew verify --console=plain
          uv run --locked --project ../corpus python -m unittest discover -s tools/tests
          uv run --locked --project ../corpus python tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
          uv run --locked --project ../corpus python tools/verify_apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-build-and-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/
          retention-days: 7
