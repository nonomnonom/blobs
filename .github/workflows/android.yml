name: Android

on:
  push:
    paths: ['android/**', 'corpus/**', '.clang-format', 'ruff.toml', '.editorconfig', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'corpus/**', '.clang-format', 'ruff.toml', '.editorconfig', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  corpus:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: corpus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
      - name: Install pinned preparation environment
        run: uv sync --locked
      - name: Check Python and native code quality
        run: |
          uv run --locked ruff check ../android/tools .
          uv run --locked ruff format --check ../android/tools .
          uv run --locked clang-format --dry-run --Werror ../android/app/src/main/cpp/blobs.cpp ../android/app/src/main/cpp/chat_prompt.cpp ../android/app/src/main/cpp/chat_prompt.h ../android/app/src/main/cpp/chat_prompt_test.cpp
      - name: Verify acquisition, normalization, recovery and native package contract
        run: |
          uv run --locked python -m unittest discover -s tests
          uv run --locked python -m unittest discover -s ../android/tools/tests

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
      - name: Install current Android tools and compile SDK
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install 'cmdline-tools;latest'
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Fetch pinned native source
        run: uv run --locked --project ../corpus python tools/fetch_runtime.py
      - name: Verify application
        run: |
          bash ./gradlew verify --console=plain
          uv run --locked --project ../corpus python -m unittest discover -s tools/tests
          uv run --locked --project ../corpus python tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
          uv run --locked --project ../corpus python tools/verify_apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build-and-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/
          retention-days: 7

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
      - name: Install current Android tools and compile SDK
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install 'cmdline-tools;latest'
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Fetch pinned native source
        run: uv run --locked --project ../corpus python tools/fetch_runtime.py
      - name: Stage hash-pinned multi-library retrieval packages
        run: >-
          uv run --locked --project ../corpus python tools/stage_multi_library_benchmark.py
          --cases ../corpus/evaluation/cases/multi-library-retrieval-scaling-v5.json
          --catalog app/src/main/assets/package-catalog.json
          --output-dir .local/ci-multi-library
      - name: Enable KVM for this runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          working-directory: android
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/ci_device_tests.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-device-test-reports
          path: android/app/build/reports/androidTests/
          retention-days: 7
