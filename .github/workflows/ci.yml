name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.select.outputs.android }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify CI selection and failure handling
        run: python3 -m unittest discover -s .github/scripts
      - name: Select affected components
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/checks.py changes

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  required:
    name: Required checks
    if: always()
    needs: [changes, android, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every selected component to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/checks.py gate
