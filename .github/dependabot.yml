version: 2
updates:
  - package-ecosystem: npm
    directory: /docs/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Match the Node 24 runtime; migrate TypeScript with its parser toolchain.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
