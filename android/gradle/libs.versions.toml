[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.12"
core = "1.19.1"
activity = "1.12.0"
lifecycle = "2.9.4"
compose-bom = "2026.09.00"
coroutines = "1.11.0"
room = "2.8.5"
sqlite = "2.7.1"
datastore = "1.3.0"
androidx-junit = "1.3.0"
androidx-runner = "1.7.0"
espresso = "3.7.0"
ktlint-plugin = "14.2.0"
ktlint-engine = "1.8.0"
tooling-logback = "1.6.6"
tooling-commons-lang = "3.21.0"
tooling-httpclient = "4.5.14"
tooling-jose = "0.9.7"
tooling-jdom = "2.0.6.1"
junit = "4.13.2"
pdfbox-android = "2.0.27.1"
bouncycastle = "1.86"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.12.0" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-runner" }
junit = { module = "junit:junit", version.ref = "junit" }
pdfbox-android = { module = "com.dineshdev:pdfbox-android", version.ref = "pdfbox-android" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-util = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
tooling-logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "tooling-logback" }
tooling-logback-core = { module = "ch.qos.logback:logback-core", version.ref = "tooling-logback" }
tooling-commons-lang = { module = "org.apache.commons:commons-lang3", version.ref = "tooling-commons-lang" }
tooling-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "tooling-httpclient" }
tooling-bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

tooling-jose = { module = "org.bitbucket.b_c:jose4j", version.ref = "tooling-jose" }
tooling-jdom = { module = "org.jdom:jdom2", version.ref = "tooling-jdom" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
