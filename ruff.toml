required-version = "==0.17.1"
target-version = "py313"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Compatibility scripts resolve the local corpus workspace before importing it.
"android/tools/build_package.py" = ["E402"]
"android/tools/tests/test_packages.py" = ["E402"]

[format]
line-ending = "lf"
