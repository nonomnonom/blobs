[project]
name = "blobs-corpus"
version = "0.1.0"
description = "Reproducible offline knowledge packages for Blobs"
requires-python = ">=3.13,<3.15"
dependencies = ["libzim==3.13.1", "selectolax==1.0.0"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "clang-format==23.1.3",
    "ruff==0.17.1",
]
evaluation = [
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "tokenizers==0.23.3",
]
publisher = [
    "cryptography==50.0.2",
]
